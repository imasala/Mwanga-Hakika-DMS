<div
  class="btn-group w-100"
  ngbDropdown
  role="group"
  [popperOptions]="popperOptions"
  [placement]="placement"
>
  <button
    class="btn btn-sm"
    id="dropdown{{ title }}"
    ngbDropdownToggle
    [ngClass]="
      expiryDateTo || expiryDateFrom || expiryIsNull
        ? 'btn-primary'
        : 'btn-outline-primary'
    "
    [disabled]="disabled"
  >
    <i-bs
      width="1em"
      height="1em"
      name="calendar-event-fill"
    ></i-bs>

    <div class="d-none d-sm-inline ms-1">
      {{ title }}
    </div>

    <pngx-clearable-badge
      [selected]="isActive"
      (cleared)="reset()"
    ></pngx-clearable-badge>

    <span class="visually-hidden">selected</span>
  </button>

  <div
    class="dropdown-menu date-dropdown shadow p-2"
    ngbDropdownMenu
    attr.aria-labelledby="dropdown{{ title }}"
  >

    <h6 class="dropdown-header border-bottom">
      Expiry Date
    </h6>

    <!-- From -->
    <div class="list-group list-group-flush">

      <div class="list-group-item d-flex p-2">

        <div class="selected-icon">
          @if (expiryDateFrom) {
            <a
              class="text-light focus-variants"
              href="javascript:void(0)"
              (click)="clearExpiryFrom()"
            >
              <i-bs
                width="1em"
                height="1em"
                name="check"
                class="variant-unfocused"
              ></i-bs>

              <i-bs
                width="1em"
                height="1em"
                name="x"
                class="variant-focused text-primary"
              ></i-bs>
            </a>
          }
        </div>

        <div class="input-group input-group-sm small ps-1 pe-2">

          <span class="input-group-text w-25 small text-muted">
            From
          </span>

          <input
            class="form-control small"
            [placeholder]="datePlaceHolder"
            (dateSelect)="onChangeDebounce()"
            (change)="onChangeDebounce()"
            (keypress)="onKeyPress($event)"
            maxlength="10"
            [(ngModel)]="expiryDateFrom"
            ngbDatepicker
            #expiryDateFromPicker="ngbDatepicker"
            [footerTemplate]="expiryFromFooterTemplate"
          >

          <button
            class="btn btn-outline-secondary"
            (click)="expiryDateFromPicker.toggle()"
            type="button"
          >
            <i-bs
              width="1em"
              height="1em"
              name="calendar"
            ></i-bs>
          </button>

          <ng-template #expiryFromFooterTemplate>
            <div class="btn-group-xs border-top p-2 d-flex">

              <button
                class="btn btn-primary"
                (click)="expiryDateFrom = today; onChangeDebounce()"
              >
                Today
              </button>

              <button
                class="btn btn-secondary ms-auto"
                (click)="expiryDateFromPicker.close()"
              >
                Close
              </button>

            </div>
          </ng-template>

        </div>

      </div>


      <!-- To -->
      <div class="list-group-item d-flex p-2">

        <div class="selected-icon">
          @if (expiryDateTo) {
            <a
              class="text-light focus-variants"
              href="javascript:void(0)"
              (click)="clearExpiryTo()"
            >
              <i-bs
                width="1em"
                height="1em"
                name="check"
                class="variant-unfocused"
              ></i-bs>

              <i-bs
                width="1em"
                height="1em"
                name="x"
                class="variant-focused text-primary"
              ></i-bs>
            </a>
          }
        </div>

        <div class="input-group input-group-sm small ps-1 pe-2">

          <span class="input-group-text w-25 small text-muted">
            To
          </span>

          <input
            class="form-control small"
            [placeholder]="datePlaceHolder"
            (dateSelect)="onChangeDebounce()"
            (change)="onChangeDebounce()"
            (keypress)="onKeyPress($event)"
            maxlength="10"
            [(ngModel)]="expiryDateTo"
            ngbDatepicker
            #expiryDateToPicker="ngbDatepicker"
            [footerTemplate]="expiryToFooterTemplate"
          >

          <button
            class="btn btn-outline-secondary"
            (click)="expiryDateToPicker.toggle()"
            type="button"
          >
            <i-bs
              width="1em"
              height="1em"
              name="calendar"
            ></i-bs>
          </button>

          <ng-template #expiryToFooterTemplate>
            <div class="btn-group-xs border-top p-2 d-flex">

              <button
                class="btn btn-primary"
                (click)="expiryDateTo = today; onChangeDebounce()"
              >
                Today
              </button>

              <button
                class="btn btn-secondary ms-auto"
                (click)="expiryDateToPicker.close()"
              >
                Close
              </button>

            </div>
          </ng-template>

        </div>

      </div>


      <!-- No expiry -->
      <div class="list-group-item d-flex p-2">

        <div class="form-check">

          <input
            class="form-check-input"
            type="checkbox"
            id="noExpiryDate"
            [(ngModel)]="expiryIsNull"
            (change)="onChange()"
          >

          <label
            class="form-check-label"
            for="noExpiryDate"
          >
            No expiry date
          </label>

        </div>

      </div>

    </div>

  </div>
</div>
